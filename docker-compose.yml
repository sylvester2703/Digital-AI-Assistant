version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex-assistant-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./assistant.db
      - SECRET_KEY=production-secret-key-change-in-prod
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend/assistant.db:/app/assistant.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex-assistant-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
